[package]
name = "openbench"
version = "0.1.0"
description = "OpenBench — учебный стенд цифровой схемотехники"
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "openbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "rt", "macros", "time"] }
getrandom = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
