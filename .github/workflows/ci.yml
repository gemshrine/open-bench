name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Lint, typecheck, tests, e2e
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build

  bundle:
    name: Desktop bundle (${{ matrix.os }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies (Tauri 2)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - run: npm run test:rust
      - run: npm run tauri build
      - run: npm run build -w @openbench/mcp-server
      - uses: actions/upload-artifact@v4
        with:
          name: openbench-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/mcp-server/dist/openbench-mcp.mjs
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # openbench-mcp.mjs is built on both platforms; attach it once.
          files=$(find artifacts -type f | awk -F/ '!seen[$NF]++')
          echo "$files"
          cat > notes.md <<'NOTES'
          | Файл | Для чего |
          |---|---|
          | `OpenBench_*_x64-setup.exe` | установщик для Windows |
          | `OpenBench_*_x64_en-US.msi` | MSI-пакет для Windows |
          | `OpenBench_*_amd64.deb` | Debian / Ubuntu 22.04+ |
          | `OpenBench-*.x86_64.rpm` | Fedora / openSUSE |
          | `OpenBench_*_amd64.AppImage` | любой Linux x86_64 без установки |
          | `openbench-mcp.mjs` | MCP-сервер для подключения MCP-клиента (нужен Node.js ≥ 20), см. `docs/mcp-setup.md` |
          NOTES
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "OpenBench ${GITHUB_REF_NAME#v}" --notes-file notes.md --generate-notes $files
